services:
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:7.0.1@sha256:eb07a0a65007c34c40c7b849592a47e6299128a514a5c6c582a53451cc6e3390
    environment:
      # The issuer carries the port it was reached on, so host and container ports must match.
      SERVER_PORT: "8180"
      JSON_CONFIG_PATH: /config/mock-oidc.json
    volumes:
      - ../test/integration/mock-oidc.json:/config/mock-oidc.json:ro
    ports:
      - "127.0.0.1:8180:8180"
    networks:
      default:
        aliases:
          - oidc.localhost

  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.31.0@sha256:97e21ac96e9a8d1ee15aaf558ba3f14998936b9d6f334e40ebb4c6c2127dc12f
    environment:
      OIDC_AUTH_ENABLED: "true"
      OIDC_CONFIGURATION_URL: http://oidc.localhost:8180/default/.well-known/openid-configuration
      OIDC_CLIENT_ID: mealie
      OIDC_CLIENT_SECRET: secret
      OIDC_SIGNUP_ENABLED: "true"
      OIDC_USER_CLAIM: email
      OIDC_ADMIN_GROUP: mealie-admins
      BASE_URL: http://localhost:9000
      TOKEN_TIME: "48"
    ports:
      - "127.0.0.1:9000:9000"
    depends_on:
      oidc:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9000/api/app/about"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  mcp:
    build: ..
    read_only: true
    environment:
      PUBLIC_URL: http://localhost:8080
      INSECURE_ALLOW_HTTP: "true"
      MEALIE_URL: http://mealie:9000
      ENCRYPTION_KEYS_FILE: /run/secrets/dev_keys
      METRICS_ADDR: ":9090"
      LOG_FORMAT: text
    secrets:
      - dev_keys
    volumes:
      - mcp-data:/data
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    depends_on:
      mealie:
        condition: service_healthy

secrets:
  dev_keys:
    file: ./encryption_keys.txt

volumes:
  mcp-data:
