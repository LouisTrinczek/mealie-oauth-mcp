services:
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:7.0.1@sha256:eb07a0a65007c34c40c7b849592a47e6299128a514a5c6c582a53451cc6e3390
    environment:
      JSON_CONFIG_PATH: /config/mock-oidc.json
    volumes:
      - ./mock-oidc.json:/config/mock-oidc.json:ro

  mealie:
    # The default carries the digest; CI's latest run replaces the whole tag.
    image: ghcr.io/mealie-recipes/mealie:${MEALIE_VERSION:-v3.31.0@sha256:97e21ac96e9a8d1ee15aaf558ba3f14998936b9d6f334e40ebb4c6c2127dc12f}
    environment:
      OIDC_AUTH_ENABLED: "true"
      OIDC_CONFIGURATION_URL: http://mock-oidc:8080/default/.well-known/openid-configuration
      OIDC_CLIENT_ID: mealie
      OIDC_CLIENT_SECRET: secret
      OIDC_SIGNUP_ENABLED: "true"
      OIDC_USER_CLAIM: email
      # Admin lets the test user create organizers and foods (can_organize).
      OIDC_ADMIN_GROUP: mealie-admins
      BASE_URL: http://mealie:9000
      TOKEN_TIME: "48"
    depends_on:
      mock-oidc:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9000/api/app/about"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  it:
    image: golang:1.27.4@sha256:5e8afd493a7124a8586e134d9b532731161d4b9becf9dee5a5956b107426f93d
    hostname: it
    working_dir: /src
    volumes:
      - ../..:/src:ro
    command: go test -tags integration -race -count=1 ./test/integration/
    depends_on:
      mock-oidc:
        condition: service_started
      mealie:
        condition: service_healthy
