events {}
http {
    ssl_certificate /tls/edge.pem;
    ssl_certificate_key /tls/edge.key;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_ssl_server_name on;
    proxy_ssl_name mcp.test;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /tls/ca.pem;
    proxy_set_header Host $http_host;

    # Separate upstreams keep TLS sessions scoped to each trust policy.
    upstream verified { server it:18443; }
    upstream wrong_ca { server it:18443; }
    upstream wrong_name { server it:18443; }

    server {
        listen 8080;
        return 308 https://$host:8443$request_uri;
    }
    server {
        listen 8443 ssl;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location / { proxy_pass https://verified; }
    }
    server {
        listen 8444 ssl;
        proxy_ssl_trusted_certificate /tls/unrelated.pem;
        location / { proxy_pass https://wrong_ca; }
    }
    server {
        listen 8445 ssl;
        proxy_ssl_name mismatch.test;
        location / { proxy_pass https://wrong_name; }
    }
}
