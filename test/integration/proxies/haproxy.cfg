global
    log stdout format raw local0
defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend plaintext
    bind :8080
    http-request redirect prefix https://haproxy:8443 code 308

frontend edge
    bind :8443 ssl crt /tls/edge-bundle.pem
    http-response set-header Strict-Transport-Security max-age=31536000
    default_backend verified
frontend wrong_ca
    bind :8444 ssl crt /tls/edge-bundle.pem
    default_backend wrong_ca
frontend wrong_name
    bind :8445 ssl crt /tls/edge-bundle.pem
    default_backend wrong_name

backend verified
    server mcp it:18443 ssl verify required ca-file /tls/ca.pem verifyhost mcp.test
backend wrong_ca
    server mcp it:18443 ssl verify required ca-file /tls/unrelated.pem verifyhost mcp.test
backend wrong_name
    server mcp it:18443 ssl verify required ca-file /tls/ca.pem verifyhost mismatch.test
