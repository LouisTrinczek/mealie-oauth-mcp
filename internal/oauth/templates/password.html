<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Mealie</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 4rem auto; padding: 0 1rem; line-height: 1.5; }
label { display: block; margin: 0.75rem 0; }
input, button { font: inherit; }
</style>
</head>
<body>
<h1>Sign in to Mealie</h1>
{{if .Upstream}}<p><a href="{{.Upstream}}">Continue with OIDC</a></p>{{end}}
<form method="post" action="{{.Action}}">
<input type="hidden" name="pending_id" value="{{.PendingID}}">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<label>Username or email <input name="username" autocomplete="username" required></label>
<label>Password <input type="password" name="password" autocomplete="current-password" required></label>
<button type="submit">Sign in with password</button>
</form>
</body>
</html>
