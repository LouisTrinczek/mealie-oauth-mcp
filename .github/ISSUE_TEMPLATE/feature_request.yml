name: Feature request
description: Suggest a new tool or action
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want an agent to do that it can't do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed tool or action
      description: The tool, action, and arguments you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you tried or considered, including the `mealie_api` tool.
