name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version or image tag
      description: For example 0.1.0, or the ghcr.io image tag you run.
    validations:
      required: true
  - type: input
    id: mealie-version
    attributes:
      label: Mealie version
    validations:
      required: true
  - type: input
    id: identity-provider
    attributes:
      label: Identity provider
      description: The provider Mealie uses for OIDC login, with its version.
    validations:
      required: true
  - type: input
    id: mcp-client
    attributes:
      label: MCP client
      description: The client you connect with, with its version.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove tokens, auth codes, and secrets before pasting.
      render: text
